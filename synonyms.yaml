# Query expansion, reviewed by hand. Edit freely; the site rebuilds from this file.
#
# synonyms: when a visitor's query contains any phrase in `terms`, the phrases in `expand`
#   are searched as well (at lower weight) and shown to the visitor as "also searched".
#   Matching is whole-word and case-insensitive. Use the law's own wording in `expand`.
#
# jurisdictions: words that tell us which law a question is about. `docs` lists loaded
#   doc_ids from sources.yaml. If a visitor asks about a law that is not loaded yet,
#   the site says so instead of returning unrelated text.

synonyms:
  - terms: [dpia, pia, "privacy impact assessment", "impact assessment"]
    expand: ["data protection impact assessment"]

  - terms: [ropa, "record of processing", "records of processing", "processing records", "processing inventory", "data inventory", "data mapping"]
    expand: ["records of processing activities", "record of processing activities"]

  - terms: [dsar, dsr, sar, "subject access request", "data subject request", "data subject requests", "access request", "request my data", "get my data"]
    expand: ["right of access by the data subject", "rights of the data subject"]

  - terms: [erase, erased, erasing, delete, deleted, deletion, "be forgotten", "right to be forgotten", "remove my data", "wipe"]
    expand: ["right to erasure", "erasure of personal data"]

  - terms: [dpo, "privacy officer"]
    expand: ["data protection officer"]

  - terms: ["lawful basis", "lawful bases", "legal basis", "legal bases", "legal grounds", "lawful ground", "lawful grounds"]
    expand: ["lawfulness of processing"]

  - terms: ["legitimate interest", "legitimate interests", "lia"]
    expand: ["legitimate interests pursued by the controller"]

  - terms: [breach, breaches, "data breach", "security incident", "data leak"]
    expand: ["personal data breach"]

  - terms: ["breach notification", "notify a breach", "report a breach", "notification of a breach", "breach reporting"]
    expand: ["notification of a personal data breach to the supervisory authority", "communication of a personal data breach to the data subject"]

  - terms: [regulator, "data protection authority", "dpa authority", "privacy regulator", "authority"]
    expand: ["supervisory authority"]

  - terms: [fine, fines, penalty, penalties, sanction, sanctions]
    expand: ["administrative fines"]

  - terms: ["processor contract", "processing agreement", "data processing agreement", "dpa", "vendor contract", "vendor agreement", "service provider contract"]
    expand: ["contract or other legal act", "processor"]

  - terms: [vendor, vendors, "service provider", "service providers", "third party processor"]
    expand: ["processor"]

  - terms: [scc, sccs, "standard contractual clauses", "contractual clauses"]
    expand: ["standard data protection clauses"]

  - terms: [bcr, bcrs]
    expand: ["binding corporate rules"]

  - terms: ["international transfer", "international transfers", "cross border", "cross-border", "transfer abroad", "send data abroad", "outside the eu", "third country", "transfers outside"]
    expand: ["transfers of personal data to third countries or international organisations"]

  - terms: [kid, kids, child, children, minor, minors, "under 16", "under 13", "parental consent"]
    expand: ["child", "information society services"]

  - terms: ["personal information", "pii", "personal info", "personally identifiable information"]
    weight: 0.3   # generic vocabulary mapping; must not outrank the visitor's more specific words
    expand: ["personal data"]

  - terms: ["sensitive data", "sensitive information", "sensitive personal data", "special category", "special categories"]
    expand: ["special categories of personal data"]

  - terms: ["health data", "health information", "medical data", "medical information"]
