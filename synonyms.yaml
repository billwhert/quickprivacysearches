    words: [gdpr, eu, europe, european, "european union", "general data protection regulation", "eea"]
    docs: [gdpr]
  - id: california
    label: "California (CCPA/CPRA, CPPA regulations, CalOPPA)"
    words: [california, californian, ccpa, cpra, caloppa, cppa, "california consumer privacy act"]
    docs: [ccpa, ccpa_regs, caloppa]
  - id: hipaa
    label: "US health privacy (HIPAA)"
    words: [hipaa, "protected health information", phi, "covered entity", "covered entities", "business associate", "business associates"]
    docs: [hipaa]
  - id: canada
