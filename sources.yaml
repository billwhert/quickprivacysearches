# One entry per document. Phase 1 documents; URLs are confirmed at step 2+.
documents:
  - doc_id: gdpr
    title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    jurisdiction: EU
    doc_type: law
    short_name: GDPR
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    # EUR-Lex's own HTML endpoint sits behind a bot challenge; the Publications Office
    # (Cellar) serves the same Official Journal text as XHTML.
    fetch_url: "http://publications.europa.eu/resource/celex/32016R0679"
    fetch_accept: "application/xhtml+xml"
    raw_ext: xhtml
    parser: eurlex
    language: en
    is_translation: false
    version_label: "Official Journal L 119, 4.5.2016 (CELEX 32016R0679, as published)"
    effective_date: "2018-05-25"  # applicable from; entered into force 2016-05-24
    license_note: "Reuse authorised. EUR-Lex states that, unless otherwise specified, the legal documents it publishes may be re-used for commercial or non-commercial purposes under Commission Decision 2011/833/EU. Only EU legal acts published in the Official Journal are authentic."
    attribution: "Regulation (EU) 2016/679, © European Union, https://eur-lex.europa.eu, 1998-2026. Reused under Commission Decision 2011/833/EU."
    reuse_url: "https://eur-lex.europa.eu/content/legal-notice/legal-notice.html"
    notes: "The text is the Official Journal version of the Regulation (CELEX 32016R0679), retrieved from the EU Publications Office. Later corrigenda and the consolidated text may differ in places; check the official source."
    validation:
      articles: 99
      recitals: 173
      definitions: 26
  - doc_id: ccpa
    title: "California Consumer Privacy Act of 2018, as amended by the CPRA (Cal. Civ. Code 1798.100 et seq.)"
    short_name: CCPA
    jurisdiction: US-CA
    doc_type: law
    # Consolidated statute text published by the California Privacy Protection Agency.
    # (The Legislature's leginfo site blocks scripted downloads.)
    source_url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
    fetch_url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
    raw_ext: pdf
    parser: code
    language: en
    is_translation: false
    version_label: "CCPA as amended through AB 137 and AB 566, effective 1 January 2026 (CPPA consolidated text, posted December 2025)"
    effective_date: "2026-01-01"
    license_note: "Public-domain government information. The State of California's Conditions of Use state that information on its websites is, unless otherwise indicated, considered public domain and may be distributed or copied as permitted by law. No attribution is required; it is given anyway."
    attribution: "California Consumer Privacy Act of 2018 (consolidated text, effective 1 January 2026), California Privacy Protection Agency, https://cppa.ca.gov. Public-domain government information under the State of California's Conditions of Use."
    reuse_url: "https://www.ca.gov/legal/conditions-of-use/"
    notes: "This is the consolidated statute published by the California Privacy Protection Agency, not the Legislature's own publication (California Legislative Information)."
    profile:
      heading_re: '^(1798\.\d+(?:\.\d+)?)\.\s*(.*)$'
      definition_sections: ["1798.140"]
  - doc_id: ccpa_regs
    title: "CPPA CCPA Regulations (Cal. Code Regs. tit. 11, 7000 et seq.)"
    short_name: "CCPA Regs"
    jurisdiction: US-CA
    doc_type: regulation
    source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
    fetch_url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
    raw_ext: pdf
    parser: code
    language: en
    is_translation: false
    version_label: "California Consumer Privacy Act Regulations, effective 1 January 2026 (CPPA consolidated text)"
    effective_date: "2026-01-01"
    license_note: "Public-domain government information. The State of California's Conditions of Use state that information on its websites is, unless otherwise indicated, considered public domain and may be distributed or copied as permitted by law. No attribution is required; it is given anyway."
    attribution: "California Consumer Privacy Act Regulations, Cal. Code Regs. tit. 11, 7000 et seq. (effective 1 January 2026), California Privacy Protection Agency, https://cppa.ca.gov. Public-domain government information under the State of California's Conditions of Use."
    reuse_url: "https://www.ca.gov/legal/conditions-of-use/"
    notes: "This is the consolidated text published by the California Privacy Protection Agency. The official publication of California regulations is the California Code of Regulations (Office of Administrative Law)."
    profile:
      heading_re: '^§\s*(7\d{3}(?:\.\d+)?)\.\s*(.*)$'
      article_re: '^ARTICLE \d+\.'
      definition_sections: ["7001"]
  - doc_id: hipaa
    title: "HIPAA Privacy, Security, and Breach Notification Rules (45 CFR Parts 160 and 164)"
    short_name: HIPAA
    jurisdiction: US-Federal
    doc_type: regulation
    source_url: "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C"
    parser: ecfr
    ecfr_title: 45
    # Text from the eCFR renderer API; the official structure (table of contents) from the
    # versioner API is saved alongside it and used to validate the section list.
    parts:
      - part: 160
        fetch_url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/{ECFR_DATE}/title-45?part=160"
        structure_url: "https://www.ecfr.gov/api/versioner/v1/structure/{ECFR_DATE}/title-45.json?part=160"
      - part: 164
        fetch_url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/{ECFR_DATE}/title-45?part=164"
        structure_url: "https://www.ecfr.gov/api/versioner/v1/structure/{ECFR_DATE}/title-45.json?part=164"
    language: en
    is_translation: false
    version_label: "Electronic Code of Federal Regulations, 45 CFR Parts 160 and 164, current as of {ECFR_DATE}"
    license_note: "US Government work, not subject to copyright (17 U.S.C. 105). The Office of the Federal Register and the Government Publishing Office state that the eCFR is an editorial compilation and not an official legal edition of the CFR."
    attribution: "45 CFR Parts 160 and 164, Electronic Code of Federal Regulations (eCFR), Office of the Federal Register, National Archives and Records Administration, and U.S. Government Publishing Office, https://www.ecfr.gov. This site is not the official CFR."
    reuse_url: "https://www.ecfr.gov/reader-aids/understanding-the-ecfr/what-is-the-ecfr"
    notes: "The eCFR is an editorial compilation, updated daily. For legal research, verify against the official CFR and the Federal Register."
    profile:
      definition_sections: ["160.103", "164.103", "164.304", "164.402", "164.501"]
      ref_numbers: '16[04]\.\d{3}'
  - doc_id: glba
