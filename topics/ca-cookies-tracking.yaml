docs: [ccpa, ccpa_regs, caloppa, gdpr]

applicability:
  - question: "Is the organization a \"business\" under the CCPA?"
    note: "The same thresholds apply as for the privacy notice topic."
    chunk_ids: ["ccpa:sec:1798.140:d"]
  - question: "Is the website's data collection a \"sale\" or \"sharing\" of personal information?"
    note: "The definitions of sell and share, and of cross-context behavioral advertising, decide whether the opt-out provisions are engaged."
    chunk_ids: ["ccpa:sec:1798.140:ad", "ccpa:sec:1798.140:ah", "ccpa:sec:1798.140:k", "ccpa:sec:1798.140:ai"]
  - question: "Are cookie and device identifiers \"personal information\"?"
    chunk_ids: ["ccpa:sec:1798.140:v", "ccpa:sec:1798.140:aj"]

items:
