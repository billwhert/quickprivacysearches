  - what to include
  - do not track

# Which loaded laws this topic draws on (used to keep it away from questions about other laws).
docs: [ccpa, ccpa_regs]

applicability:
  - question: "Is the organization a \"business\" under the CCPA?"
    note: "The definition sets thresholds based on revenue, volume of personal information handled, and share of revenue from selling or sharing personal information."
    chunk_ids: ["ccpa:sec:1798.140:d"]
  - question: "Is the person whose information is collected a \"consumer\"?"
    chunk_ids: ["ccpa:sec:1798.140:i"]
  - question: "Is the information \"personal information\"?"
    chunk_ids: ["ccpa:sec:1798.140:v"]

items:
  - label: "What the CCPA says about a notice at or before the point of collection"
    chunk_ids: ["ccpa:sec:1798.100:a", "ccpa_regs:sec:7012:a", "ccpa_regs:sec:7012:c", "ccpa_regs:sec:7012:e", "ccpa_regs:sec:7012:f"]
  - label: "What the provisions say about third parties that control the collection"
    chunk_ids: ["ccpa:sec:1798.100:b", "ccpa_regs:sec:7012:g"]
  - label: "What the online privacy policy must contain, and how often it is updated"
    chunk_ids: ["ccpa:sec:1798.130:a.5", "ccpa_regs:sec:7011:a", "ccpa_regs:sec:7011:d", "ccpa_regs:sec:7011:e"]
  - label: "How notices must be presented (readable, accessible, easy to find)"
    chunk_ids: ["ccpa_regs:sec:7003:a", "ccpa_regs:sec:7003:b", "ccpa_regs:sec:7003:c", "ccpa_regs:sec:7003:d"]
  - label: "Which disclosures the regulations list in total"
    chunk_ids: ["ccpa_regs:sec:7010:a", "ccpa_regs:sec:7010:b", "ccpa_regs:sec:7010:e", "ccpa_regs:sec:7010:f", "ccpa_regs:sec:7010:g"]

related:
