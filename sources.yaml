# One entry per document. Phase 1 documents; URLs are confirmed at step 2+.
documents:
  - doc_id: gdpr
    title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    jurisdiction: EU
    doc_type: law
    short_name: GDPR
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    # EUR-Lex's own HTML endpoint sits behind a bot challenge; the Publications Office
    # (Cellar) serves the same Official Journal text as XHTML.
    fetch_url: "http://publications.europa.eu/resource/celex/32016R0679"
    fetch_accept: "application/xhtml+xml"
    raw_ext: xhtml
    parser: eurlex
    language: en
    is_translation: false
    version_label: "Official Journal L 119, 4.5.2016 (CELEX 32016R0679, as published)"
    effective_date: "2018-05-25"  # applicable from; entered into force 2016-05-24
    license_note: "EU legislation reuse is authorised with acknowledgement of source (Commission Decision 2011/833/EU). Confirm wording at step 11."
    validation:
      articles: 99
      recitals: 173
      definitions: 26
  - doc_id: ccpa
    title: "California Consumer Privacy Act of 2018, as amended by the CPRA (Cal. Civ. Code 1798.100 et seq.)"
    short_name: CCPA
    jurisdiction: US-CA
    doc_type: law
    # Consolidated statute text published by the California Privacy Protection Agency.
    # (The Legislature's leginfo site blocks scripted downloads.)
    source_url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
    fetch_url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
    raw_ext: pdf
    parser: code
    language: en
    is_translation: false
    version_label: "CCPA as amended through AB 137 and AB 566, effective 1 January 2026 (CPPA consolidated text, posted December 2025)"
    effective_date: "2026-01-01"
    license_note: "California statutory text is public record. Source: California Privacy Protection Agency. Confirm attribution wording at step 11."
    profile:
      heading_re: '^(1798\.\d+(?:\.\d+)?)\.\s*(.*)$'
      definition_sections: ["1798.140"]
  - doc_id: ccpa_regs
    title: "CPPA CCPA Regulations (Cal. Code Regs. tit. 11, 7000 et seq.)"
    short_name: "CCPA Regs"
    jurisdiction: US-CA
    doc_type: regulation
    source_url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
    fetch_url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
    raw_ext: pdf
    parser: code
    language: en
    is_translation: false
    version_label: "California Consumer Privacy Act Regulations, effective 1 January 2026 (CPPA consolidated text)"
    effective_date: "2026-01-01"
    license_note: "California regulations are public record. Source: California Privacy Protection Agency. Confirm attribution wording at step 11."
    profile:
      heading_re: '^§\s*(7\d{3}(?:\.\d+)?)\.\s*(.*)$'
      article_re: '^ARTICLE \d+\.'
      definition_sections: ["7001"]
  - doc_id: caloppa
    title: "California Online Privacy Protection Act (Cal. Bus. & Prof. Code 22575-22579)"
    short_name: CalOPPA
    jurisdiction: US-CA
    doc_type: law
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=BPC&division=8.&chapter=22.&article="
    # leginfo blocks scripted downloads, so the page text was captured from the rendered page.
    fetch_method: manual
    fetch_note: "Text of the rendered leginfo.legislature.ca.gov page (BPC Division 8, Chapter 22), captured via a browser."
    manual_retrieved_at: "2026-10-14T13:20:00Z"
    raw_ext: txt
    parser: code
    language: en
    is_translation: false
    version_label: "Cal. Bus. & Prof. Code 22575-22579, as published by the California Legislature (leginfo); 22575 amended by Stats. 2013, Ch. 390 (AB 370), effective 1 January 2014"
    effective_date: "2004-07-01"  # operative date; 22575 last amended effective 2014-01-01
    license_note: "California statutory text is public record. Source: California Legislative Information. Confirm attribution wording at step 11."
    profile:
      heading_re: '^(2257\d)\.\s*(.*)$'
      toc: ["22575", "22576", "22577", "22578", "22579"]
      note_re: '^\((?:Added|Amended|Repealed|Enacted)\b'
      default_article: "Chapter 22. Internet Privacy Requirements"
      default_title: "Internet Privacy Requirements"
  - doc_id: hipaa
    title: "HIPAA Privacy, Security, and Breach Notification Rules (45 CFR Parts 160 and 164)"
    short_name: HIPAA
    jurisdiction: US-Federal
    doc_type: regulation
    source_url: "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C"
    parser: ecfr
    ecfr_title: 45
    # Text from the eCFR renderer API; the official structure (table of contents) from the
    # versioner API is saved alongside it and used to validate the section list.
    parts:
      - part: 160
        fetch_url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/{ECFR_DATE}/title-45?part=160"
        structure_url: "https://www.ecfr.gov/api/versioner/v1/structure/{ECFR_DATE}/title-45.json?part=160"
      - part: 164
        fetch_url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/{ECFR_DATE}/title-45?part=164"
        structure_url: "https://www.ecfr.gov/api/versioner/v1/structure/{ECFR_DATE}/title-45.json?part=164"
    language: en
    is_translation: false
    version_label: "Electronic Code of Federal Regulations, 45 CFR Parts 160 and 164, current as of {ECFR_DATE}"
    license_note: "Works of the US Government are in the public domain. Source: Electronic Code of Federal Regulations (eCFR), Office of the Federal Register. Note: the eCFR is an unofficial editorial compilation; the official CFR is published annually by the Government Publishing Office. Confirm wording at step 11."
    profile:
      definition_sections: ["160.103", "164.103", "164.304", "164.402", "164.501"]
